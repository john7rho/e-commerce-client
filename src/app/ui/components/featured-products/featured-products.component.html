<section class="featured-products" aria-label="Featured products">
  <h2>Featured Products</h2>

  <div *ngIf="isLoading" class="featured-products__status">Loading products...</div>
  <div *ngIf="!isLoading && !currentProduct" class="featured-products__status">
    No featured products available.
  </div>

  <div *ngIf="currentProduct as product" class="featured-products__carousel">
    <button
      type="button"
      class="featured-products__control"
      aria-label="Previous featured product"
      (click)="previous()"
    >
      Previous
    </button>

    <article class="featured-products__card">
      <img
        [src]="product.mainImagePath || 'assets/product.png'"
        [alt]="product.name"
      />
      <div>
        <h3>{{ product.name }}</h3>
        <p>{{ product.price | currency }}</p>
        <p>{{ product.stock }} in stock</p>
      </div>
    </article>

    <button
      type="button"
      class="featured-products__control"
      aria-label="Next featured product"
      (click)="next()"
    >
      Next
    </button>
  </div>
</section>

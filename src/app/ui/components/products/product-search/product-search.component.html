<div class="container mt-3">
  <div class="row">
    <div class="col-12 col-md-6 mx-auto">
      <input
        type="text"
        class="form-control"
        name="productSearch"
        placeholder="Search products by name..."
        aria-label="Search products by name"
        [ngModel]="query"
        (ngModelChange)="onQueryChange($event)"
      />
    </div>
  </div>
</div>

<div class="container mt-3">
  <div class="row g-2 align-items-center product-search-bar">
    <div class="col-12 col-md-6">
      <input
        type="text"
        class="form-control"
        placeholder="Search products by name..."
        aria-label="Search products by name"
        [ngModel]="query"
        (ngModelChange)="onQueryChange($event)"
      />
    </div>
    <div class="col-8 col-md-4">
      <select
        class="form-select"
        aria-label="Sort products by price"
        [ngModel]="sort"
        (ngModelChange)="onSortChange($event)"
      >
        <option value="default">Sort: Featured</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
      </select>
    </div>
    <div class="col-4 col-md-2 d-grid">
      <button type="button" class="btn btn-outline-secondary" (click)="clear()">
        Clear
      </button>
    </div>
  </div>

  <p class="text-muted mt-2 mb-0 result-count">
    Showing {{ filteredProducts.length }} of {{ (products || []).length }}
    loaded products
  </p>
</div>

<div class="container mt-2">
  <div class="row gap-3 m-auto">
    <div
      class="card col-3 gx-0"
      style="width: 18.8rem"
      *ngFor="let product of filteredProducts"
    >
      <img
        *ngIf="!product.productImageFiles || !product.productImageFiles.length"
        src="../../../../../assets/product.png"
        class="card-img-top"
        width="250px"
        height="250px"
        alt="..."
      />
      <img
        *ngIf="product.productImageFiles && product.productImageFiles.length"
        src="{{ baseStorageUrl?.url }}/{{ product.mainImagePath }}"
        class="card-img-top"
        width="250px"
        height="250px"
        alt="..."
      />
      <div class="card-body">
        <h5 class="card-title h5" style="font-size: 20px">
          {{ product.name }}
        </h5>
        <p class="card-text">
          Price: {{ product.price | currency }} <br />
          Stock: {{ product.stock }}
        </p>
        <a href="#" class="btn btn-success">Add to Card</a>
      </div>
    </div>
  </div>

  <p
    *ngIf="(products || []).length && !filteredProducts.length"
    class="text-center text-muted mt-4 no-results"
  >
    No products match "{{ query }}".
  </p>
</div>
